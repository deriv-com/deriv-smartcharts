name: Sync translations

# Extracts the `localize()` strings in src, translates the new ones with Makima and uploads
# the catalogues to `translations.deriv.com/<R2_PROJECT_NAME>/<environment>/translations`,
# where the SmartCharts runtime reads them. Same action and setup as the other Deriv front
# ends (see deriv-com/deriv-blox's sync_translations.yml).
#
# Staging: push to master, schedule, or manual dispatch.
# Production: called by publish-smart-charts.yml after a release (tags pushed by
# semantic-release with GITHUB_TOKEN trigger no workflows), or manual dispatch.
# A run is live (R2 upload) only when the environment variable MAKIMA_LIVE is exactly
# 'true' and, for a manual dispatch, dry_run is unticked. Otherwise it is a dry run that
# writes the catalogues as a workflow artifact.
on:
    push:
        branches:
            - master
    schedule:
        # Offset from :00 to avoid GitHub Actions UTC midnight/noon contention.
        - cron: '17 */12 * * *'
    workflow_dispatch:
        inputs:
            environment:
                description: Target environment
                required: true
                default: staging
                type: choice
                options:
                    - staging
                    - production
            dry_run:
                description: Write the catalogues as a workflow artifact instead of uploading to R2
                required: false
                type: boolean
                default: true
    workflow_call:
        inputs:
            environment:
                description: Target environment
                required: true
                type: string

jobs:
    sync_translations:
        # Cloudflare in front of the Makima gateway blocks GitHub-hosted runner
        # IPs (HTTP 403 "Attention Required!"); this self-hosted group is allow-listed.
        runs-on:
            group: github_claude_code_reviewer
        environment: ${{ inputs.environment || 'staging' }}
        timeout-minutes: 30
        concurrency:
            group: sync-translations-${{ inputs.environment || 'staging' }}
            cancel-in-progress: false
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.ref }}

            - name: Sync SmartCharts translations
              uses: deriv-com/translations/.github/actions/extract_and_sync_translations_makima@17dbcfe83c92d6622134c29789429e3df484cf61 # v1.5.4
              with:
                  PROJECT_NAME: ${{ vars.R2_PROJECT_NAME || 'deriv-smartcharts' }}
                  # src only: app/ is the demo app, which is not shipped.
                  PROJECT_SOURCE_DIRECTORY: 'src'
                  ENVIRONMENT: ${{ inputs.environment || 'staging' }}
                  # Not km and id: Makima does not support Khmer or Indonesian. Their catalogues
                  # stay on the CDN as they are; new strings show in English.
                  # zh_cn / zh_tw are the runtime's file names (v1.5.4 maps them to Makima's
                  # Simplified / Traditional Chinese).
                  TARGET_LOCALES: ar,bn,de,es,fr,it,ko,mn,pl,pt,ru,si,sw,ta,th,tr,uz,vi,zh_cn,zh_tw
                  MAKIMA_API_KEY: ${{ secrets.MAKIMA_API_KEY }}
                  MAKIMA_API_BASE: ${{ vars.MAKIMA_API_BASE }}
                  # Names that must stay in English: indicator abbreviations and the like.
                  PROTECTED_TERMS_FILE: translations.protected-terms.json
                  DRY_RUN: ${{ vars.MAKIMA_LIVE != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
